name: Capture Max V3 simulator screenshots
on:
  push:
    branches: ['codex/max-v3-screenshots']
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: macos-15
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ios-swift
    steps:
      - uses: actions/checkout@v4
      - name: Prepare native simulator project
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          brew install xcodegen
          cp Configuration/Public.example.xcconfig Configuration/Public.xcconfig
          xcodegen generate
      - name: Capture screenshots
        run: |
          if ! xcodebuild -project Max.xcodeproj -scheme Max -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO \
            -only-testing:MaxTests/ScreenshotTests/testV3HomeAndVisualIntelligence test > capture.log 2>&1; then
            tail -150 capture.log
            exit 1
          fi
          python3 - <<'PY'
          from base64 import b64decode
          from pathlib import Path
          import re
          log = Path("capture.log").read_text()
          target = Path("screenshots")
          target.mkdir()
          for name in ("Max_V3_HomeView", "Max_V3_Visual_Intelligence"):
              chunks = re.findall(r"^MAX_UI_IMAGE " + name + r" ([A-Za-z0-9+/=]+)$", log, re.M)
              assert chunks and "MAX_UI_IMAGE_END " + name in log, name
              data = b64decode("".join(chunks), validate=True)
              assert data.startswith(b"\xff\xd8") and data.endswith(b"\xff\xd9"), name
              (target / (name + ".jpg")).write_bytes(data)
              for chunk in chunks:
                  print("MAX_IMAGE_TRANSFER", name, chunk)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: max-v3-simulator-screenshots
          path: ios-swift/screenshots/*.jpg
          if-no-files-found: error
