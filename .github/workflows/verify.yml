name: Verify Max V1
on:
  push:
    branches: [main, codex/max-build-streaming-fixes]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  server-and-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test --prefix backend
  ios-build:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios-swift
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate app and extension project
        run: |
          cp Configuration/Public.example.xcconfig Configuration/Public.xcconfig
          xcodegen generate
      - name: Build simulator app and extensions without credentials
        run: |
          set -o pipefail
          xcodebuild -project Max.xcodeproj -scheme Max -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tee build.log
      - name: Save build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-evidence
          path: ios-swift/build.log
          if-no-files-found: ignore
