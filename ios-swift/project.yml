name: Max
options:
  deploymentTarget:
    iOS: '18.0'
    macOS: '14.0'
    watchOS: '11.0'
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  Max:
    type: application
    platform: iOS
    sources:
      - path: Sources/Max
      - path: Sources/MaxThoughts
      - path: Sources/SharedBrand
    configFiles:
      Debug: Configuration/Public.xcconfig
      Release: Configuration/Public.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gindausd.max
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Configuration/Max.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: Supabase
        product: Supabase
      - target: MaxLiveActivity
        embed: true
      - target: MaxWidget
        embed: true
  MaxLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - Sources/MaxLiveActivity
      - Sources/Max/LiveActivity/MaxActivityAttributes.swift
      - Sources/Max/Components/MaxLogoView.swift
      - Sources/SharedBrand
    info:
      path: Configuration/LiveActivity-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gindausd.max.liveactivity
        CODE_SIGN_ENTITLEMENTS: Configuration/Widget.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  MaxWidget:
    type: app-extension
    platform: iOS
    sources:
      - Sources/MaxWidget
      - Sources/Max/Components/MaxLogoView.swift
      - Sources/SharedBrand
    info:
      path: Configuration/Widget-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gindausd.max.widget
        CODE_SIGN_ENTITLEMENTS: Configuration/Widget.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  MaxWatch:
    type: application
    platform: watchOS
    sources: [Sources/MaxWatch, Sources/MaxThoughts]
    dependencies:
      - target: MaxWatchWidget
        embed: true
    info:
      path: Configuration/Watch-Info.plist
      properties:
        CFBundleDisplayName: Max
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKWatchOnly: true
        NSMicrophoneUsageDescription: Record thoughts in Max.
        CFBundleURLTypes:
          - CFBundleURLName: com.gindausd.max.watch.capture
            CFBundleURLSchemes: [max-watch]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gindausd.max.watch
        TARGETED_DEVICE_FAMILY: '4'
        CODE_SIGN_ENTITLEMENTS: Configuration/MaxWatch.entitlements
  MaxWatchWidget:
    type: app-extension
    platform: watchOS
    sources: [Sources/MaxWatchWidget]
    info:
      path: Configuration/WatchWidget-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gindausd.max.watch.capture
        TARGETED_DEVICE_FAMILY: '4'
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  MaxMac:
    type: application
    platform: macOS
    sources: [Sources/MaxMac, Sources/MaxThoughts]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gindausd.max.mac
        TARGETED_DEVICE_FAMILY: ''
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Max
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Record thoughts in Max.
        CODE_SIGN_ENTITLEMENTS: Configuration/MaxMac.entitlements
  MaxTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Max
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gindausd.max.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Max:
    build:
      targets:
        Max: all
    test:
      targets: [MaxTests]
  MaxWatch:
    build:
      targets:
        MaxWatch: all
  MaxMac:
    build:
      targets:
        MaxMac: all
